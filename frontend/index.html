<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>lf-openalex-enrichment-mvp V0.3</title>
  <style>body{font-family:Arial,sans-serif;padding:24px} pre{background:#f3f3f3;padding:12px;border-radius:8px}</style>
</head>
<body>
  <h1>lf-openalex-enrichment-mvp — V0.3</h1>
  <p>Frontend consumindo endpoint <code>/sample</code> com fallback em arquivo local.</p>
  <pre id="out">carregando...</pre>
  <script>
    const out = document.getElementById('out');
    fetch('http://localhost:8000/sample')
      .then(r => { if(!r.ok) throw new Error('http'); return r.json(); })
      .then(d => out.textContent = JSON.stringify(d, null, 2))
      .catch(() => fetch('../data/sample-output.json')
        .then(r => r.json())
        .then(d => out.textContent = JSON.stringify({fallback:true, ...d}, null, 2))
        .catch(() => out.textContent = 'erro ao carregar dados'));
  </script>
</body>
</html>
