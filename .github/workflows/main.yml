name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      working-directory: projects/lf-openalex-enrichment-mvp
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run smoke test
      working-directory: projects/lf-openalex-enrichment-mvp
      run: python smoke_test.py
