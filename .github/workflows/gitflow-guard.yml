name: GitFlow Guard

on:
  push:
    branches: ["main"]

jobs:
  block-direct-main:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on direct push to main
        run: |
          echo "🚫 Direct push em main detectado. Use feature branch + PR + review + merge."
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          exit 1
